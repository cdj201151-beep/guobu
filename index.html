<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>顾客信息采集</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#f2f2f7;color:#1c1c1e;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    padding-bottom:calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
    overscroll-behavior-y:contain;
  }
  /* ---------- 顶部栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;
    background:rgba(242,242,247,.86);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid #d6d6db;
    display:flex;align-items:flex-end;justify-content:space-between;
  }
  .topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
  .topbar .sub{font-size:12px;color:#8e8e93;margin-top:2px}
  .topbar .clear-btn{
    border:none;background:transparent;color:#ff3b30;font-size:15px;
    padding:6px 4px;font-family:inherit;
  }
  /* ---------- 卡片 ---------- */
  .card{
    background:#fff;margin:12px;border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.03);
  }
  .card-hd{
    padding:14px 16px 6px;font-size:13px;font-weight:600;color:#8e8e93;
    letter-spacing:.02em;background:#fff;
  }
  .field{padding:8px 16px 10px}
  .field + .field{border-top:.5px solid #ececf0}
  .field label{display:block;font-size:13px;color:#6e6e73;font-weight:500;margin-bottom:2px}
  .row{display:flex;align-items:center;gap:8px}
  input,select,textarea{
    flex:1;width:100%;min-width:0;border:none;background:transparent;
    font-family:inherit;font-size:16px;color:#1c1c1e;
    padding:7px 0;outline:none;border-radius:0;
  }
  input::placeholder,textarea::placeholder,select:invalid{color:#c4c4c9}
  select{appearance:none;-webkit-appearance:none;min-height:36px}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  input[type=date]{min-height:36px;color:#1c1c1e}
  input.err{color:#ff3b30;font-weight:600}
  .scan-btn{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    border:none;background:#eef4ff;color:#007aff;
    font-size:14px;font-weight:600;font-family:inherit;
    padding:8px 13px;border-radius:10px;transition:background .15s;
  }
  .scan-btn:active{background:#d8e6ff}
  .scan-btn svg{width:15px;height:15px}
  /* ---------- 底部操作栏 ---------- */
  .actions{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.93);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid #d6d6db;
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
  }
  .btn{
    border:none;border-radius:12px;padding:14px 8px;
    font-family:inherit;font-size:15px;font-weight:600;
    background:#f0f0f5;color:#1c1c1e;transition:transform .1s,opacity .1s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:scale(.97);opacity:.85}
  .btn.primary{background:#007aff;color:#fff}
  .btn.green{background:#34c759;color:#fff}
  /* ---------- 扫码全屏 ---------- */
  .scanner{position:fixed;inset:0;z-index:999;background:#000;display:none}
  .scanner.show{display:block}
  .scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .scan-frame{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:62%;max-width:280px;height:22vh;min-height:110px;max-height:150px;border-radius:14px;
    border:2px solid rgba(255,255,255,.92);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.45);
    pointer-events:none;
  }
  .scan-frame::after{
    content:'';position:absolute;left:6%;right:6%;top:50%;height:2px;
    background:linear-gradient(90deg,transparent,#34c759,transparent);
    animation:sweep 2s ease-in-out infinite;
  }
  @keyframes sweep{0%,100%{top:12%}50%{top:88%}}
  .scanner-top{
    position:absolute;top:0;left:0;right:0;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    color:#fff;font-size:15px;font-weight:600;
    background:linear-gradient(rgba(0,0,0,.6),transparent);
  }
  .icon-btn{
    width:40px;height:40px;border-radius:20px;border:none;
    background:rgba(255,255,255,.18);color:#fff;font-size:17px;
    display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .scanner-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    padding:16px 16px calc(22px + env(safe-area-inset-bottom));
    color:#fff;text-align:center;
    background:linear-gradient(transparent,rgba(0,0,0,.7));
  }
  .scanner-bottom p{margin:0 0 14px;font-size:14px;opacity:.9;white-space:pre-line}
  .scanner-btns{display:flex;gap:12px;justify-content:center}
  .ghost-btn{
    flex:1;max-width:170px;border:1.5px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.12);color:#fff;
    padding:13px 10px;border-radius:12px;font-size:15px;font-weight:600;
    font-family:inherit;
  }
  .ghost-btn:active{background:rgba(255,255,255,.28)}
  /* ---------- 进度遮罩 ---------- */
  .progress{
    position:fixed;inset:0;z-index:1000;display:none;
    align-items:center;justify-content:center;background:rgba(0,0,0,.4);
  }
  .progress.show{display:flex}
  .progress-box{
    background:rgba(30,30,32,.92);color:#fff;border-radius:16px;
    padding:26px 30px;min-width:210px;text-align:center;
  }
  .spinner{
    width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
    border:3px solid rgba(255,255,255,.25);border-top-color:#fff;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-text{font-size:14px;line-height:1.5;white-space:pre-line}
  /* ---------- 结果面板 ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:#fff;border-radius:18px 18px 0 0;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding-bottom:env(safe-area-inset-bottom);
    max-height:82vh;display:flex;flex-direction:column;
    box-shadow:0 -6px 30px rgba(0,0,0,.18);
  }
  .sheet.show{transform:translateY(0)}
  .sheet-hd{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:.5px solid #ececf0;
    font-weight:600;font-size:16px;
  }
  .sheet-hd button{
    border:none;background:transparent;color:#007aff;font-size:15px;
    font-family:inherit;font-weight:500;padding:4px;
  }
  .sheet textarea{
    flex:1;margin:0;padding:14px 16px;border:none;outline:none;
    font-size:14px;line-height:1.6;min-height:220px;background:#fff;
    resize:none;color:#3a3a3c;
  }
  .sheet-ft{
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
    padding:10px 14px 14px;border-top:.5px solid #ececf0;
  }
  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px);z-index:1200;
    background:rgba(30,30,32,.93);color:#fff;
    padding:11px 18px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:all .25s;
    max-width:80vw;text-align:center;line-height:1.4;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .hint{
    margin:12px 16px 0;font-size:12px;color:#9a9aa0;line-height:1.6;text-align:center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>顾客信息采集</h1>
    <div class="sub">电子发票 · 移动通信设备</div>
  </div>
  <button class="clear-btn" id="btnClear">清空</button>
</div>

<form id="form" autocomplete="off"></form>

<p class="hint">
  提示：摄像头需在 HTTPS 环境下使用。<br>
  扫码时把条码放进取景框、尽量占满框；条码读不到会自动改读包装上印的 UPC / Serial No. 文字。
</p>

<!-- 底部操作栏 -->
<div class="actions">
  <button type="button" class="btn" id="btnOcr">📷 拍照识别文字</button>
  <button type="button" class="btn" id="btnCopy">📋 复制信息</button>
  <button type="button" class="btn" id="btnExport">📤 导出 CSV</button>
  <button type="button" class="btn primary" id="btnSave">💾 保存记录</button>
</div>

<!-- 扫码全屏 -->
<div class="scanner" id="scanner">
  <video id="video" playsinline muted autoplay></video>
  <div class="scan-frame"></div>
  <div class="scanner-top">
    <button class="icon-btn" id="scanClose">✕</button>
    <span id="scanTitle">扫描包装条码</span>
    <button class="icon-btn" id="scanTorch" hidden>⚡</button>
    <span style="width:40px"></span>
  </div>
  <div class="scanner-bottom">
    <p id="scanTip">正在启动摄像头…</p>
    <div class="scanner-btns">
      <button type="button" class="ghost-btn" id="scanPhoto">拍照识别</button>
      <button type="button" class="ghost-btn" id="scanCancel">取消</button>
    </div>
  </div>
</div>

<!-- 进度遮罩 -->
<div class="progress" id="progress">
  <div class="progress-box">
    <div class="spinner"></div>
    <div class="progress-text">处理中…</div>
  </div>
</div>

<!-- 识别结果面板 -->
<div class="sheet" id="ocrSheet">
  <div class="sheet-hd">
    <span>识别结果</span>
    <button type="button" id="ocrClose">关闭</button>
  </div>
  <textarea id="ocrText" readonly></textarea>
  <div class="sheet-ft">
    <button type="button" class="btn" id="ocrCopy">复制文字</button>
    <button type="button" class="btn primary" id="ocrFill">填入表单</button>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="ocrInput" accept="image/*" capture="environment" hidden>
<div id="toast"></div>

<script>
/* ============================================================
   1. 字段配置（依据电子发票内容整理）
   ============================================================ */
const GROUPS = [
  {
    title: '购买方信息',
    fields: [
      { id:'name',    label:'购买方名称', ph:'请输入姓名', scan:true },
      { id:'taxNo',   label:'统一社会信用代码 / 纳税人识别号', ph:'请输入 18 位代码', scan:true },
      { id:'address', label:'购买方地址', ph:'xx省xx市xx区/县xx街道xx小区xx号楼xx单元xxx室（自提商品需填写消费者提供的家庭地址）' },
      { id:'phone',   label:'购买方电话', ph:'请输入手机号', type:'tel', inputmode:'tel', scan:true }
    ]
  },
  {
    title: '商品信息',
    fields: [
      { id:'hostType', label:'主机类型', type:'select',
        options:['Mac', 'iPad', 'iPhone', 'watch'],
        ph:'请选择主机类型' },
      { id:'code69', label:'69码（包装 UPC 条码）', ph:'扫码或手动输入', inputmode:'numeric', scan:true },
      { id:'sn',     label:'SN码（包装 Serial No. 条码）', ph:'扫码或手动输入', scan:true }
    ]
  },
  {
    title: '发票信息',
    fields: [
      { id:'total',       label:'价税合计（元）', ph:'0.00', inputmode:'decimal' },
      { id:'paid',        label:'实付金额（元）', ph:'自动计算（价税合计 − 补贴金额）', readonly:true },
      { id:'subsidy',     label:'补贴金额（元）', ph:'自动计算（价税合计 × 15%，按主机类型封顶）', readonly:true },
      { id:'buyDate',     label:'购买日期', ph:'', type:'date', def:'today' },
      { id:'payChannel',  label:'支付渠道', ph:'云闪付 / 微信 / 支付宝', def:'云闪付' },
      { id:'tradeNo',     label:'交易单号', ph:'扫码或手动输入', inputmode:'numeric', scan:true }
    ]
  },
  {
    title: '备注',
    fields: [
      { id:'remark', label:'备注', ph:'其他需要说明的信息', type:'textarea' }
    ]
  }
];
const ALL_FIELDS = GROUPS.flatMap(g => g.fields);

/* ============================================================
   2. 渲染表单
   ============================================================ */
const formEl = document.getElementById('form');

const SCAN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3M3 12h18"/></svg>';

GROUPS.forEach(group => {
  const card = document.createElement('section');
  card.className = 'card';

  const hd = document.createElement('div');
  hd.className = 'card-hd';
  hd.textContent = group.title;
  card.appendChild(hd);

  group.fields.forEach(f => {
    const field = document.createElement('div');
    field.className = 'field';

    if (f.type === 'select') {
      const opts = ['<option value="" disabled' + (f.def ? '' : ' selected') + '>请选择</option>']
        .concat((f.options || []).map(o =>
          `<option value="${o}"${f.def === o ? ' selected' : ''}>${o}</option>`))
        .join('');
      field.innerHTML = `
        <label for="f-${f.id}">${f.label}</label>
        <select id="f-${f.id}" autocomplete="off" required>${opts}</select>`;
    } else if (f.type === 'textarea') {
      field.innerHTML = `
        <label for="f-${f.id}">${f.label}</label>
        <textarea id="f-${f.id}" rows="3" placeholder="${f.ph || ''}"></textarea>`;
    } else {
      const inputmode = f.inputmode ? ` inputmode="${f.inputmode}"` : '';
      const type = f.type || 'text';
      const readonly = f.readonly ? ' readonly tabindex="-1"' : '';
      field.innerHTML = `
        <label for="f-${f.id}">${f.label}</label>
        <div class="row">
          <input id="f-${f.id}" type="${type}"${inputmode}${readonly}
                 placeholder="${f.ph || ''}" autocomplete="off"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          ${f.scan ? `<button type="button" class="scan-btn" data-scan="f-${f.id}">${SCAN_ICON}扫</button>` : ''}
        </div>`;
    }
    card.appendChild(field);

    // 默认值：购买日期取当天，支付渠道默认云闪付
    if (f.def) {
      const el = field.querySelector('input,textarea');
      if (el) el.value = (f.def === 'today') ? todayStr() : f.def;
    }
  });

  formEl.appendChild(card);
});

/* ============================================================
   3. 工具函数
   ============================================================ */
const $ = s => document.querySelector(s);
const getEl = id => document.getElementById(id);

function toast(msg, ms = 2200) {
  const t = getEl('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms);
}
function showProgress(msg) {
  getEl('progress').querySelector('.progress-text').textContent = msg;
  getEl('progress').classList.add('show');
}
function updateProgress(msg) {
  getEl('progress').querySelector('.progress-text').textContent = msg;
}
function hideProgress() { getEl('progress').classList.remove('show'); }
function buzz(p = 18) { if (navigator.vibrate) navigator.vibrate(p); }
function pad2(n) { return String(n).padStart(2, '0'); }

/* 本地当天日期 YYYY-MM-DD */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

/* 恢复默认值（清空后调用） */
function applyDefaults() {
  ALL_FIELDS.forEach(f => {
    if (!f.def) return;
    const el = getEl('f-' + f.id);
    if (el) el.value = (f.def === 'today') ? todayStr() : f.def;
  });
}

/* ============================================================
   补贴规则：补贴 = 价税合计 × 15%（封顶）；实付 = 价税合计 − 补贴
   iPhone / iPad / watch（3C）：价税合计 ≤ 6000 元，补贴封顶 500 元
   Mac（家电）：补贴封顶 1500 元
   ============================================================ */
const HOST_RULES = {
  'iPhone': { maxTotal: 6000, cap: 500 },
  'iPad':   { maxTotal: 6000, cap: 500 },
  'watch':  { maxTotal: 6000, cap: 500 },
  'Mac':    { cap: 1500 }
};

function round2(n) { return Math.round(n * 100) / 100; }

function calcSubsidy(silent) {
  const typeEl  = getEl('f-hostType');
  const totalEl = getEl('f-total');
  const paidEl  = getEl('f-paid');
  const subEl   = getEl('f-subsidy');
  if (!typeEl || !totalEl || !paidEl || !subEl) return;

  paidEl.value = '';
  subEl.value = '';
  totalEl.classList.remove('err');

  const type  = typeEl.value || '';
  const total = parseFloat(String(totalEl.value).replace(/,/g, ''));
  if (!type || !(total > 0)) return;

  const rules = HOST_RULES[type];
  if (rules && rules.maxTotal && total > rules.maxTotal) {
    totalEl.classList.add('err');
    if (!silent) toast(`该主机类型价税合计不能超过 ${rules.maxTotal} 元`);
    return;
  }

  const subsidy = rules ? Math.min(round2(total * 0.15), rules.cap) : round2(total * 0.15);
  subEl.value  = subsidy.toFixed(2);
  paidEl.value = round2(total - subsidy).toFixed(2);
}

function collect() {
  const o = {};
  ALL_FIELDS.forEach(f => {
    const el = getEl('f-' + f.id);
    o[f.id] = el ? el.value.trim() : '';
  });
  return o;
}

/* ============================================================
   4. 本地暂存（自动保存草稿）
   ============================================================ */
const DRAFT_KEY = 'dzfp_draft_v1';

(function restoreDraft() {
  try {
    const o = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}');
    Object.keys(o).forEach(k => {
      const el = getEl('f-' + k);
      if (el && o[k]) el.value = o[k];
    });
  } catch (e) { /* ignore */ }
})();

calcSubsidy(true);   // 草稿恢复后按规则重算实付 / 补贴

let draftTimer;
document.addEventListener('input', e => {
  if (!e.target.closest('#form')) return;
  // 价税合计变动 → 实时重算（超上限仅标红，不打断输入）
  if (e.target.id === 'f-total') { calcSubsidy(true); }
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); } catch (e) {}
  }, 400);
});

// 切换主机类型 → 重算（超上限时给出提示）
document.addEventListener('change', e => {
  if (e.target.id === 'f-hostType') calcSubsidy(false);
});

/* ============================================================
   5. 扫码（BarcodeDetector 优先，ZXing 兜底）
   ============================================================ */
const scannerEl = getEl('scanner');
const videoEl   = getEl('video');
const scanTipEl = getEl('scanTip');

const BARCODE_FORMATS = [
  'ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93',
  'itf','codabar','qr_code','data_matrix','pdf417'
];

const scan = {
  stream: null, detector: null, reader: null,
  timer: null, rvfcId: 0, target: null, active: false,
  torchTrack: null, torchOn: false, startedAt: 0, ocrTried: false
};

function setTip(msg) { scanTipEl.textContent = msg; }

async function openScanner(targetId) {
  scan.target = targetId;
  scan.active = true;
  scan.startedAt = Date.now();
  scan.ocrTried = false;
  scannerEl.classList.add('show');
  setTip('正在启动摄像头…');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setTip('当前浏览器不支持摄像头\n请点「拍照识别」选择图片');
    scan.active = false;
    return;
  }

  try {
    scan.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    videoEl.srcObject = scan.stream;
    await videoEl.play().catch(() => {});

    // 连续自动对焦 + 闪光灯按钮（设备支持时）
    try {
      const track = scan.stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
      scan.torchTrack = caps.torch ? track : null;
      getEl('scanTorch').hidden = !caps.torch;
      scan.torchOn = false;
    } catch (e) { scan.torchTrack = null; }

    await beginDecode();
  } catch (err) {
    scan.active = false;
    setTip('无法打开摄像头：' + (err.message || err) + '\n可点「拍照识别」选择图片');
  }
}

/* 取景框裁剪参数：只截框内中间条带并放大 1.8 倍再解码，
   手机镜头的细条码（UPC / Code128）成功率提升明显 */
const CROP = { w: 0.62, h: 0.34, scale: 1.8 };
const cropCanvas = document.createElement('canvas');

function grabFrame() {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if (!vw || !vh) return null;
  const cw = Math.round(vw * CROP.w);
  const ch = Math.round(vh * CROP.h);
  const sx = Math.round((vw - cw) / 2);
  const sy = Math.max(0, Math.round(vh * 0.46 - ch / 2));
  cropCanvas.width  = Math.round(cw * CROP.scale);
  cropCanvas.height = Math.round(ch * CROP.scale);
  const ctx = cropCanvas.getContext('2d');
  ctx.drawImage(videoEl, sx, sy, cw, ch, 0, 0, cropCanvas.width, cropCanvas.height);
  return cropCanvas;
}

async function beginDecode() {
  // 方案 A：原生 BarcodeDetector
  if ('BarcodeDetector' in window) {
    try {
      scan.detector = new BarcodeDetector({ formats: BARCODE_FORMATS });
      setTip('把条码放进框内、尽量占满框\nUPC 与 Serial No. 可一次同时识别');
      scanLoop();
      return;
    } catch (e) { /* 继续降级 */ }
  }

  // 方案 B：ZXing（同样只解裁剪后的画面）
  try {
    await loadZXing();
    const Z = window.ZXing;
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [
      Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8,
      Z.BarcodeFormat.UPC_A,  Z.BarcodeFormat.UPC_E,
      Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39,
      Z.BarcodeFormat.CODE_93,  Z.BarcodeFormat.ITF,
      Z.BarcodeFormat.CODABAR,  Z.BarcodeFormat.QR_CODE,
      Z.BarcodeFormat.DATA_MATRIX, Z.BarcodeFormat.PDF_417
    ]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);

    scan.reader = new Z.BrowserMultiFormatReader(hints);
    setTip('把条码放进框内、尽量占满框\nUPC 与 Serial No. 可一次同时识别');
    scanLoop();
  } catch (e) {
    // 条码引擎不可用（多为网络/CDN 问题）→ 直接走文字识别
    setTip('条码组件不可用，改为识别包装文字…');
    scan.timer = setTimeout(() => {
      if (!scan.active) return;
      scan.ocrTried = true;
      tryAutoOcr();
    }, 600);
  }
}

async function scanLoop() {
  if (!scan.active) return;
  const frame = grabFrame();
  let got = null;

  if (frame) {
    try {
      if (scan.detector) {
        const codes = await scan.detector.detect(frame);
        if (codes && codes.length) {
          got = codes.map(c => ({ text: c.rawValue, format: c.format }));
        }
      } else if (scan.reader) {
        const r = await scan.reader.decodeFromCanvas(frame);
        if (r) got = [{ text: r.getText(), format: zxingFmtName(r) }];
      }
    } catch (e) { /* 未命中，继续下一帧 */ }
  }

  if (!scan.active) return;
  if (got) { handleCodes(got); return; }

  // 连续 3 秒读不到条码 → 抓一帧改做文字识别（每轮扫码只试一次）
  if (!scan.ocrTried && Date.now() - scan.startedAt > 3000) {
    scan.ocrTried = true;
    tryAutoOcr();
    return;
  }

  scan.timer = setTimeout(scanLoop, scan.detector ? 50 : 110);
}

/* 整帧抓图（给 OCR 用，保留条形码下方的印刷数字） */
const ocrCanvas = document.createElement('canvas');
function grabFullFrame() {
  const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
  if (!vw || !vh) return null;
  const scale = Math.min(1, 1600 / Math.max(vw, vh));
  ocrCanvas.width  = Math.round(vw * scale);
  ocrCanvas.height = Math.round(vh * scale);
  ocrCanvas.getContext('2d').drawImage(videoEl, 0, 0, ocrCanvas.width, ocrCanvas.height);
  return ocrCanvas;
}

async function tryAutoOcr() {
  const frame = grabFullFrame();
  if (!frame) { scanLoop(); return; }

  setTip('条码没读到，正在识别包装文字…');
  try {
    const blob = await new Promise(res => frame.toBlob(res, 'image/jpeg', 0.92));
    ocrProgressCb = m => {
      if (m.status === 'recognizing text') {
        setTip('识别文字中… ' + Math.round((m.progress || 0) * 100) + '%');
      } else if (m.status === 'loading language traineddata') {
        setTip('首次使用，正在下载文字识别语言包…');
      }
    };
    const text = await ocrImage(blob, 'eng');
    ocrProgressCb = null;
    if (!scan.active) return;

    const codes = codesToFill(extractCodes(text));
    if (codes.length) { handleCodes(codes); return; }
    setTip('没读到条码，也未能识别文字\n请点「拍照识别」，让条码和数字占满画面');
  } catch (e) {
    ocrProgressCb = null;
    if (scan.active) setTip((e && e.message ? e.message : '条码识别失败') + '\n可点「拍照识别」靠近拍一张');
  }
  if (scan.active) scanLoop();
}

function cancelTick() {
  clearTimeout(scan.timer);
  scan.timer = null;
  scan.rvfcId = 0;
}

function setField(id, text) {
  const el = getEl(id);
  if (!el) return;
  el.value = text;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* 条码分类：UPC / EAN（8~14 位纯数字）→ 69码；其余（如 Serial No. 的 Code 128）→ SN码 */
const EAN_UPC_SET = new Set(['ean_13', 'ean_8', 'upc_a', 'upc_e']);
function classifyCode(text, format) {
  const t = String(text || '').trim();
  if (!t) return null;
  const isUpcLike = EAN_UPC_SET.has(format || '') || /^\d{8,14}$/.test(t);
  return isUpcLike ? 'code69' : 'sn';
}

/* 从 OCR 文本中提取 UPC（69码）与 Serial No.（SN码）
   包装上印的人眼可读数字往往比细条码更容易识别 → 作为条码识别失败后的兜底 */
function extractCodes(raw) {
  const out = { code69: '', sn: '' };
  if (!raw) return out;

  const text = String(raw).replace(/[，。；、,;:.：·()（）【】\[\]]/g, ' ');
  const tokens = text.replace(/\s+/g, ' ').trim().split(' ');
  if (!tokens.length) return out;

  // ---- 69码：优先 UPC 关键字后面连续的数字段（UPC-A 印刷为 1 95950 39532 7 形式）----
  const digitRuns = [];
  let run = [];
  tokens.forEach(t => {
    if (/^\d+$/.test(t)) { run.push(t); return; }
    if (run.length) { digitRuns.push(run.join('')); run = []; }
  });
  if (run.length) digitRuns.push(run.join(''));

  const upcIdx = tokens.findIndex(t => /^U\.?P\.?C\.?$/i.test(t));
  if (upcIdx >= 0) {
    // UPC 后面 6 个 token 内的纯数字拼起来
    let buf = '';
    for (let i = upcIdx + 1; i < Math.min(tokens.length, upcIdx + 8); i++) {
      if (/^\d+$/.test(tokens[i])) buf += tokens[i];
      else if (buf) break;
    }
    if (/^\d{8,14}$/.test(buf)) out.code69 = buf;
  }
  if (!out.code69) {
    out.code69 = digitRuns.find(s => /^\d{12,13}$/.test(s)) || '';
  }

  // ---- SN码：Serial No. 之后的字母数字组合（I 与 O 按印刷习惯纠正为 1 / 0）----
  const snFix = s => String(s).toUpperCase().replace(/O/g, '0').replace(/[^A-Z0-9]/g, '');
  let idx = tokens.findIndex(t => /^(serial|seria1|serlal|ser[a-z]{2,4}l)$/i.test(t));
  if (idx >= 0) {
    for (let i = idx + 1; i < Math.min(tokens.length, idx + 6); i++) {
      const t = tokens[i];
      if (/^N[o0]?$/i.test(t)) continue;
      if (/^[A-Za-z0-9]{8,16}$/.test(t) && /\d/.test(t)) {
        out.sn = snFix(t);
        break;
      }
    }
  }
  if (!out.sn) {
    // 兜底：10~12 位、同时含字母与数字的独立 token（排除 IMEI 等纯数字）
    const cand = tokens.find(t => /^[A-Za-z0-9]{10,12}$/.test(t) && /\d/.test(t) && /[A-Za-z]/.test(t));
    if (cand) out.sn = snFix(cand);
  }
  return out;
}

/* OCR 文本 → 直接填表（扫码兜底用） */
function codesToFill(extract) {
  const codes = [];
  if (extract.code69) codes.push({ text: extract.code69, format: 'upc_a' });
  if (extract.sn)     codes.push({ text: extract.sn,     format: 'code_128' });
  return codes;
}
function zxingFmtName(result) {
  try {
    const Z = window.ZXing;
    const f = result.getBarcodeFormat();
    const M = {};
    M[Z.BarcodeFormat.EAN_13] = 'ean_13';   M[Z.BarcodeFormat.EAN_8] = 'ean_8';
    M[Z.BarcodeFormat.UPC_A] = 'upc_a';     M[Z.BarcodeFormat.UPC_E] = 'upc_e';
    M[Z.BarcodeFormat.CODE_128] = 'code_128'; M[Z.BarcodeFormat.CODE_39] = 'code_39';
    M[Z.BarcodeFormat.CODE_93] = 'code_93'; M[Z.BarcodeFormat.ITF] = 'itf';
    M[Z.BarcodeFormat.CODABAR] = 'codabar'; M[Z.BarcodeFormat.QR_CODE] = 'qr_code';
    M[Z.BarcodeFormat.DATA_MATRIX] = 'data_matrix'; M[Z.BarcodeFormat.PDF_417] = 'pdf417';
    return M[f] || '';
  } catch (e) { return ''; }
}

/* 识别结果处理：商品字段扫码时智能分流，一次可同时填 69码 + SN码 */
function handleCodes(codes) {
  if (!codes || !codes.length || !scan.active) return;
  const targetId = scan.target || '';
  const isGoods = targetId === 'f-code69' || targetId === 'f-sn';

  if (!isGoods) {
    closeScanner();
    setField(targetId, codes[0].text);
    buzz(30);
    toast('已识别：' + (codes[0].text.length > 28 ? codes[0].text.slice(0, 28) + '…' : codes[0].text));
    return;
  }

  const want   = targetId === 'f-code69' ? '69码' : 'SN码';
  const otherW = targetId === 'f-code69' ? 'SN码' : '69码';
  let hitTarget = false, hitOther = false;

  codes.forEach(c => {
    const cls = classifyCode(c.text, c.format);
    if (cls === 'code69') {
      if (targetId === 'f-code69' || !getEl('f-code69').value) {
        setField('f-code69', c.text);
        targetId === 'f-code69' ? hitTarget = true : hitOther = true;
      }
    } else if (cls === 'sn') {
      if (targetId === 'f-sn' || !getEl('f-sn').value) {
        setField('f-sn', c.text);
        targetId === 'f-sn' ? hitTarget = true : hitOther = true;
      }
    }
  });

  if (hitTarget) {
    closeScanner();
    buzz(30);
    toast(hitOther ? '69码、SN码已一次填好' : '已识别并填入' + want);
  } else if (hitOther) {
    setTip('已填入' + otherW + '，继续对准' + want + '条码…');
  } else {
    setTip('识别到的条码不是' + want + '\n请对准包装上对应的条码');
  }
}

function closeScanner() {
  scan.active = false;
  cancelTick();

  // 关闭闪光灯
  if (scan.torchTrack && scan.torchOn) {
    try { scan.torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
  }
  scan.torchTrack = null;
  scan.torchOn = false;

  if (scan.reader) {
    try { scan.reader.reset(); } catch (e) {}
    scan.reader = null;
  }
  scan.detector = null;

  if (scan.stream) {
    scan.stream.getTracks().forEach(t => t.stop());
    scan.stream = null;
  }
  videoEl.srcObject = null;
  scannerEl.classList.remove('show');
}

/* 多 CDN 依次尝试加载脚本（单个 CDN 不通时自动换源） */
function loadScript(urls) {
  return new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) { reject(new Error('脚本加载失败')); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = () => resolve(s.src);
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

/* ZXing 懒加载 */
let zxingPromise = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (zxingPromise) return zxingPromise;
  zxingPromise = loadScript([
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
    'https://fastly.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'
  ]).catch(err => { zxingPromise = null; throw err; });
  return zxingPromise;
}

/* ============================================================
   6. 拍照 / 相册 识别条码
   ============================================================ */
async function decodeImageCodes(file) {
  const url = URL.createObjectURL(file);
  try {
    // 优先原生 API（可一次取到多张条码）
    if ('BarcodeDetector' in window) {
      try {
        const bmp = await createImageBitmap(file);
        const det = new BarcodeDetector({ formats: BARCODE_FORMATS });
        const codes = await det.detect(bmp);
        if (codes && codes.length) {
          return codes.map(c => ({ text: c.rawValue, format: c.format }));
        }
      } catch (e) { /* 降级 */ }
    }
    // ZXing 兜底
    await loadZXing();
    const reader = new window.ZXing.BrowserMultiFormatReader();
    const res = await reader.decodeFromImageUrl(url);
    if (res && res.getText) {
      return [{ text: res.getText(), format: zxingFmtName(res) }];
    }
    return null;
  } catch (e) {
    return null;
  } finally {
    URL.revokeObjectURL(url);
  }
}

});

/* ============================================================
   7. OCR 文字识别（Tesseract.js）
   ============================================================ */
let tesseractPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractPromise) return tesseractPromise;
  tesseractPromise = loadScript([
    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://fastly.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    'https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js'
  ]).catch(err => { tesseractPromise = null; throw new Error('OCR 组件加载失败'); });
  return tesseractPromise;
}

/* 复用 OCR worker（避免每次都重新下载语言包，二次识别快很多） */
let ocrProgressCb = null;
const ocrWorkers = {};
async function ocrImage(file, lang) {
  await loadTesseract();
  let w = ocrWorkers[lang];
  if (!w) {
    const logger = m => { if (ocrProgressCb) ocrProgressCb(m); };
    // 语言包走 CDN；超过 60 秒仍未就绪则中止，避免一直卡在「下载语言包」
    w = await withTimeout(
      window.Tesseract.createWorker(lang, 1, { logger }),
      60000,
      '语言包下载超时，请检查网络后重试'
    );
    ocrWorkers[lang] = w;
  }
  const { data } = await w.recognize(file);
  return (data && data.text) ? data.text : '';
}

/* Promise 超时保护 */
function withTimeout(promise, ms, msg) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error(msg)), ms);
    promise.then(v => { clearTimeout(t); resolve(v); },
                 e => { clearTimeout(t); reject(e); });
  });
}

/* 大图先压到 1600px 长边，OCR 速度更快、精度的损失可忽略 */
async function shrinkImage(file, maxSide = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    if (scale >= 1) return file;
    const c = document.createElement('canvas');
    c.width  = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.92));
  } catch (e) { return file; }
}

/* ---- 从 OCR 文本中提取字段 ---- */
function fillFromText(raw) {
  if (!raw) return 0;
  const text = raw.replace(/[ \t\u3000]+/g, ' ').replace(/[＊*]/g, '');
  let count = 0;

  const set = (id, val) => {
    if (!val) return;
    const el = getEl('f-' + id);
    if (!el) return;
    el.value = val;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    count++;
  };
  const pick = (re, group = 1) => {
    const m = text.match(re);
    return m ? String(m[group]).trim() : '';
  };

  // 包装标签：UPC 数字 → 69码；Serial No. → SN码
  const ex = extractCodes(raw);
  set('code69', ex.code69);
  set('sn', ex.sn);

  // 购买方名称（第一处“名称：”）
  const name = pick(/名\s*称\s*[：:]\s*([^\n]{1,40})/);
  if (name && name.length <= 40) set('name', name.replace(/[（(].*?[）)]/g, '').trim());

  // 统一社会信用代码 / 纳税人识别号
  set('taxNo', pick(/(?:统一社会信用代码|纳税人识别号)[^\n]{0,14}[：:]\s*([0-9A-Za-z]{15,20})/));

  // 地址 / 电话
  set('address', pick(/购买方地址\s*[：:]\s*([^\n]{4,80})/));
  set('phone', pick(/(?:购买方电话\s*[：:]\s*)?(1[3-9]\d{9})/));

  // 69 码 / SN
  set('code69', pick(/69\s*码\s*[：:]\s*(\d{8,14})/));
  set('sn', pick(/S\s*N\s*[：:]\s*([A-Za-z0-9]{6,24})/));

  // 价税合计（小写）——填入后触发实付 / 补贴自动重算
  set('total', pick(/[（(]\s*小写\s*[）)]\s*[¥￥]?\s*([\d,]+\.\d{2})/));

  // 购买日期
  let m = text.match(/购买日期\s*[：:]\s*(\d{4})\s*[年\-\/.]\s*(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})/);
  if (m) set('buyDate', `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`);

  // 支付渠道
  set('payChannel', pick(/支付渠道\s*[：:]\s*([^\s；;，,。\n]{2,12})/));

  // 交易单号
  set('tradeNo', pick(/交易单号\s*[：:]\s*(\d{10,})/));

  return count;
}

/* ============================================================
   8. 复制 / 保存 / 导出
   ============================================================ */
function copyText(text) {
  if (!text) { toast('没有可复制的内容'); return; }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => toast('已复制到剪贴板'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch (e) { toast('复制失败，请长按手动选择'); }
  document.body.removeChild(ta);
}

getEl('btnCopy').addEventListener('click', () => {
  const d = collect();
  const lines = ALL_FIELDS
    .filter(f => d[f.id])
    .map(f => `${f.label}：${d[f.id]}`);
  if (!lines.length) { toast('还没有填写内容'); return; }
  copyText(lines.join('\n'));
});

const RECORD_KEY = 'dzfp_records_v1';
function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORD_KEY) || '[]'); }
  catch (e) { return []; }
}
function saveRecords(list) {
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(list)); } catch (e) {}
}

getEl('btnSave').addEventListener('click', () => {
  const d = collect();
  if (!d.name) { toast('请至少填写「购买方名称」'); getEl('f-name').focus(); return; }
  if (!d.hostType) { toast('请选择主机类型'); getEl('f-hostType').focus(); return; }
  const total = parseFloat(String(d.total).replace(/,/g, ''));
  if (!(total > 0)) { toast('请填写价税合计'); getEl('f-total').focus(); return; }
  const rules = HOST_RULES[d.hostType];
  if (rules && rules.maxTotal && total > rules.maxTotal) {
    toast(`该主机类型价税合计不能超过 ${rules.maxTotal} 元`);
    getEl('f-total').focus();
    return;
  }
  calcSubsidy(true);   // 保存前确保实付 / 补贴已按规则算好
  const list = loadRecords();
  d._savedAt = new Date().toLocaleString('zh-CN');
  list.push(d);
  saveRecords(list);
  buzz(25);
  toast(`已保存，当前共 ${list.length} 条记录`);
});

getEl('btnExport').addEventListener('click', () => {
  const list = loadRecords();
  if (!list.length) { toast('还没有保存的记录'); return; }

  const keys = ALL_FIELDS.map(f => f.id);
  const cols = ALL_FIELDS.map(f => f.label).concat(['保存时间']);
  const esc = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;

  const rows = [cols.map(esc).join(',')];
  list.forEach(r => {
    rows.push(keys.map(k => esc(r[k])).concat(esc(r._savedAt || '')).join(','));
  });

  const blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `顾客信息_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`已导出 ${list.length} 条记录`);
});

getEl('btnClear').addEventListener('click', () => {
  if (!confirm('确定清空当前表单内容吗？（已保存的记录不受影响）')) return;
  ALL_FIELDS.forEach(f => {
    const el = getEl('f-' + f.id);
    if (el) el.value = '';
  });
  applyDefaults();   // 购买日期回到当天、支付渠道回到云闪付
  calcSubsidy(true); // 清掉实付 / 补贴与超标标红
  localStorage.removeItem(DRAFT_KEY);
  toast('已清空');
});

/* ============================================================
   9. 细节处理
   ============================================================ */
// 点击空白处收起键盘
document.addEventListener('touchstart', e => {
  if (e.target === document.body) document.activeElement && document.activeElement.blur();
}, { passive: true });

// 扫码页面打开时禁止背景滚动
const observer = new MutationObserver(() => {
  const open = scannerEl.classList.contains('show');
  document.body.style.overflow = open ? 'hidden' : '';
});
observer.observe(scannerEl, { attributes: true, attributeFilter: ['class'] });

// 跨天回到前台时，若购买日期未被手动改过，自动更新为当天
let autoDate = (getEl('f-buyDate') || {}).value || todayStr();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const el = getEl('f-buyDate');
  if (!el) return;
  const today = todayStr();
  if (today === autoDate) return;
  if (el.value === autoDate || !el.value) {
    el.value = today;
    autoDate = today;
  }
});
</script>
